name: dbt build

on:
  workflow_call: {}
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_portfolio
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY_JSON }}' > gcp-key.json

      - name: dbt build (prod)
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_portfolio/ci
        run: dbt build --target prod
