name: Ingest Global Voices RSS feed

on:
  workflow_call: {} # invoked as the first step of the daily pipeline (see daily_pipeline.yml)
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Fetch feed and load into BigQuery
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          BQ_DATASET: global_voices_raw
          BQ_TABLE: articles_raw
          BQ_LOCATION: US
        run: python ingestion/fetch_feed.py
